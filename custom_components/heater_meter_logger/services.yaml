add_device:
  name: Add device
  description: Create a new local device stored in the integration config entry.
  fields:
    name:
      description: Name of the device to create.
      example: Boiler
    area:
      description: Optional area/room for the device.
      example: Basement

add_reading:
  name: Add reading
  description: Add a reading to a device's stored readings.
  fields:
    device_id:
      description: ID of the device to add the reading to.
      example: local-1a2b3c4d
      required: true
    value:
      description: Numeric value of the reading.
      example: 12.34
      required: true
    timestamp:
      description: ISO 8601 timestamp for the reading (optional). If omitted, current time is used.

delete_reading:
  name: Delete reading
  description: Remove a reading from a device by reading id.
  fields:
    device_id:
      description: ID of the device containing the reading.
      example: local-1a2b3c4d
      required: true
    reading_id:
      description: ID of the reading to remove.
      example: r-1a2b3c4d
      required: true

delete_device:
  name: Delete device
  description: Remove a device and its readings from local storage.
  fields:
    device_id:
      description: ID of the device to delete.
      required: true

export_data:
  name: Export data
  description: Export stored devices and readings to a JSON file. If `path` is omitted the file is written to the Home Assistant config directory.
  fields:
    path:
      description: Absolute file path to write the export to (optional).

import_data:
  name: Import data
  description: Import devices/readings from JSON payload or a file path. Provide either `json` or `path`.
  fields:
    path:
      description: Path to a JSON file containing devices/readings (optional).
    json:
      description: JSON string payload to import (optional).

populate_device_select:
  name: Populate device select
  description: Populate an `input_select` entity with current devices (options formatted as "<name> — <device_id>").
  fields:
    input_select:
      description: Entity id of the `input_select` to populate (e.g. input_select.my_devices).
      required: true
